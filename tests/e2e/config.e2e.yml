---
environment: "release"
db:
  driver: "mysql"
  connection: "crynux_bridge:crynuxbridgepass@(mysql_bridge:3306)/crynux_bridge?parseTime=true"
  log:
    level: "info"
    output: "/app/data/logs/crynux_bridge_db.log"
    max_file_size: 100
    max_days: 30
    max_file_num: 5
log:
  level: "info"
  output: "/app/data/logs/crynux_bridge.log"
  max_file_size: 100
  max_days: 30
  max_file_num: 5
admin:
  auth_token: ""
  task_trace_max_tasks: 100
http:
  host: "0.0.0.0"
  port: "5028"
  max_body_bytes: 2097152
data_dir:
  inference_tasks: "/app/data/inference_tasks"
  inference_tasks_retention_days: 7
  model_images: "/app/data/images/models"
blockchain:
  account:
    address: ""
    private_key_file: "/app/config/privkey.txt"
relay:
  # Use the local relay service started by docker-compose for e2e runs.
  base_url: "http://crynux_relay:8080"
task:
  default_sd_task_fee_cnx: "1.0"
  default_sd_xl_task_fee_cnx: "2.0"
  default_llm_task_fee_cnx: "5.0"
  default_sd_finetune_task_fee_cnx: "15.0"
  repeat_num: 1
  sd_finetune_timeout: 120
  default_task_version: "3.7.0"
  engine:
    scan_interval: 1s
    status_poll_interval: 1s
    execution_poll_advance: 5s
    max_execution_poll_interval: 15s
    execution_overrun_poll_interval: 5s
    retry_interval: 3s
    operation_timeout: 30s
    expansion_batch_size: 100
    operation_result_batch_size: 200
    due_task_batch_size: 500
    create_batch_size: 100
    status_batch_size: 200
    validation_batch_size: 100
    cancellation_batch_size: 100
    create_workers: 2
    status_workers: 4
    validation_workers: 2
    cancellation_workers: 2
    result_workers: 4
  heartbeat_tasks:
    batch_size: 1
    max_tasks_per_hour: 20
    max_total_pending_tasks: 0
    tasks_file: "heartbeat_tasks.json"
task_schema:
  stable_diffusion_inference: "https://raw.githubusercontent.com/crynux-network/stable-diffusion-task/main/schema/image-task.json"
  gpt_inference: "https://raw.githubusercontent.com/crynux-network/gpt-task/main/schema/gpt-inference-task.json"
  stable_diffusion_finetune_lora: "https://raw.githubusercontent.com/crynux-network/stable-diffusion-task/main/schema/stable-diffusion-finetune-lora-task.json"
